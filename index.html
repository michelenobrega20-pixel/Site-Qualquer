<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mini Brawl Stars - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Lilita One', cursive, sans-serif;
            touch-action: none;
        }

        body {
            background-color: #050b14;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            background: #0d1b2a;
            border: 4px solid #000;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        /* --- MENU PRINCIPAL --- */
        #main-menu {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, #1d4ed8 0%, #0f172a 100%);
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 3px solid #000;
        }

        .profile-card {
            display: flex; align-items: center;
            background: #1e293b; border: 3px solid #000;
            border-radius: 12px; padding: 4px 12px;
        }

        .trophy-badge {
            background: #f59e0b; border: 2px solid #000;
            border-radius: 8px; padding: 2px 8px; margin-left: 10px;
            font-size: 14px; text-shadow: 1px 1px #000;
        }

        .resources { display: flex; gap: 10px; }
        .res-box {
            background: #0f172a; border: 2px solid #000;
            border-radius: 10px; padding: 4px 12px;
            display: flex; align-items: center; gap: 6px; font-size: 16px;
        }

        .side-menu {
            position: absolute; top: 70px; left: 15px;
            display: flex; flex-direction: column; gap: 12px; z-index: 5;
        }

        .btn-side {
            width: 85px; height: 65px;
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border: 3px solid #000; border-radius: 12px;
            box-shadow: 0 4px 0 #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; font-size: 12px;
        }

        .btn-side:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

        .center-display {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 10px;
        }

        #preview-canvas { width: 170px; height: 170px; }

        .bottom-bar {
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 15px; background: rgba(0, 0, 0, 0.4); border-top: 3px solid #000;
        }

        .mode-card {
            width: 250px; height: 65px;
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border: 3px solid #000; border-radius: 12px;
            display: flex; align-items: center; padding: 0 12px; gap: 12px;
        }

        .btn-play {
            width: 200px; height: 70px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            border: 4px solid #000; border-radius: 16px;
            box-shadow: 0 6px 0 #000; font-size: 28px; color: #fff;
            text-shadow: 2px 2px #000; cursor: pointer;
        }

        /* --- MODAIS --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }

        .modal-box {
            width: 90%; max-width: 750px; height: 460px;
            background: #1e293b; border: 4px solid #000;
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; position: relative;
        }

        .modal-close {
            position: absolute; top: 10px; right: 15px;
            background: #ef4444; border: 2px solid #000;
            border-radius: 8px; color: white; padding: 4px 12px; cursor: pointer;
        }

        .shop-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            padding: 8px 16px; background: #334155; border: 2px solid #000;
            border-radius: 8px; color: white; cursor: pointer;
        }
        .tab-btn.active { background: #3b82f6; }

        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; overflow-y: auto; padding-right: 5px; flex: 1;
        }

        .card-item {
            background: #0f172a; border: 3px solid #000; border-radius: 12px;
            padding: 10px; display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; text-align: center;
        }

        .card-item.selected { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }

        .btn-buy {
            background: #22c55e; border: 2px solid #000; color: white;
            padding: 6px 12px; border-radius: 8px; cursor: pointer;
            font-size: 14px; width: 100%; margin-top: 5px;
        }
        .btn-buy.disabled { background: #64748b; cursor: not-allowed; }

        /* --- CANVAS DE JOGO E CONTROLES TOUCH --- */
        #game-canvas { display: none; width: 100%; height: 100%; background: #2e7d32; }

        .hud-top {
            position: absolute; top: 10px; width: 100%;
            display: none; justify-content: center; gap: 20px; z-index: 15;
            pointer-events: none;
        }

        .team-score {
            background: rgba(0,0,0,0.7); border: 3px solid #000;
            border-radius: 10px; padding: 6px 16px; font-size: 18px;
            display: flex; align-items: center; gap: 8px;
        }

        #countdown-box {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: #ef4444; border: 3px solid #000; border-radius: 10px;
            padding: 6px 20px; font-size: 22px; display: none; z-index: 15;
            animation: pulse 0.6s infinite alternate;
        }

        /* D-PAD / TOUCH MOBILE */
        #touch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 20; pointer-events: none;
        }

        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px;
            width: 140px; height: 140px; pointer-events: auto;
        }

        #joystick-base {
            width: 120px; height: 120px; background: rgba(0,0,0,0.4);
            border: 3px solid rgba(255,255,255,0.6); border-radius: 50%;
            position: absolute; top: 10px; left: 10px;
        }

        #joystick-stick {
            width: 50px; height: 50px; background: rgba(255,255,255,0.9);
            border: 3px solid #000; border-radius: 50%;
            position: absolute; top: 45px; left: 45px;
        }

        .action-btn {
            position: absolute; pointer-events: auto; border-radius: 50%;
            border: 4px solid #000; display: flex; justify-content: center;
            align-items: center; font-size: 28px; box-shadow: 0 4px 0 #000;
        }

        #btn-shoot {
            bottom: 25px; right: 25px; width: 85px; height: 85px;
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
        }

        #btn-super-touch {
            bottom: 125px; right: 40px; width: 70px; height: 70px;
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            opacity: 0.4;
        }

        #btn-super-touch.ready { opacity: 1.0; animation: pulse 0.8s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

<div id="game-container">
    <!-- MENU PRINCIPAL -->
    <div id="main-menu">
        <div class="top-bar">
            <div class="profile-card">
                <div style="font-size:24px; margin-right:8px;">🤠</div>
                <div>
                    <div style="font-size:15px;" id="menu-nick">Jogador</div>
                    <div class="trophy-badge">🏆 <span id="menu-trophies">0</span></div>
                </div>
            </div>

            <div class="resources">
                <div class="res-box">🪙 <span id="menu-coins">0</span></div>
                <div class="res-box">💎 <span id="menu-gems">0</span></div>
            </div>
        </div>

        <div class="side-menu">
            <div class="btn-side" onclick="openModal('shop-modal')">🛒<span style="margin-top:2px;">LOJA</span></div>
            <div class="btn-side" onclick="openModal('brawlers-modal')">🥊<span style="margin-top:2px;">BRAWLERS</span></div>
        </div>

        <div class="center-display">
            <canvas id="preview-canvas"></canvas>
            <h2 id="equipped-name" style="text-shadow: 2px 2px #000; margin-top:5px;">SHELLY</h2>
            <span id="equipped-skin-name" style="font-size:12px; color:#aaa;">Padrão</span>
        </div>

        <div class="bottom-bar">
            <div class="mode-card">
                <span style="font-size:32px;">💎</span>
                <div>
                    <div style="font-size:16px;">PIQUE-GEMA</div>
                    <div style="font-size:11px; color:#cbd5e1;">3v3 • Pegue 10 Gemas</div>
                </div>
            </div>

            <button class="btn-play" onclick="startGame()">JOGAR</button>
        </div>
    </div>

    <!-- MODAL LOJA -->
    <div class="modal-overlay" id="shop-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('shop-modal')">X</button>
            <h2>LOJA DE BRAWLERS E SKINS</h2>
            <div class="shop-tabs">
                <button class="tab-btn active" id="tab-brawlers-btn" onclick="switchShopTab('brawlers')">Brawlers</button>
                <button class="tab-btn" id="tab-skins-btn" onclick="switchShopTab('skins')">Skins</button>
            </div>
            <div class="grid-container" id="shop-grid"></div>
        </div>
    </div>

    <!-- MODAL SELEÇÃO DE BRAWLERS -->
    <div class="modal-overlay" id="brawlers-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('brawlers-modal')">X</button>
            <h2>SEUS BRAWLERS</h2>
            <div class="grid-container" id="brawlers-grid" style="margin-top:15px;"></div>
        </div>
    </div>

    <!-- MODAL FIM DE JOGO -->
    <div class="modal-overlay" id="game-over-modal">
        <div class="modal-box" style="width:400px; height:320px; align-items:center; text-align:center;">
            <h1 id="end-title" style="font-size:36px; margin-top:10px;">VITÓRIA!</h1>
            <div style="font-size:50px; margin:10px 0;" id="end-icon">🏆</div>
            <div style="display:flex; gap:20px; font-size:20px; margin-bottom:15px;">
                <div>🏆 <span id="reward-trophies">+8</span></div>
                <div>💎 <span id="reward-gems">+5</span></div>
                <div>🪙 <span id="reward-coins">+30</span></div>
            </div>
            <button class="btn-buy" style="font-size:18px; padding:10px;" onclick="closeModal('game-over-modal'); exitGame();">CONTINUAR</button>
        </div>
    </div>

    <!-- HUD DE PIQUE-GEMA -->
    <div class="hud-top" id="game-hud">
        <div class="team-score" style="border-color:#3b82f6;">🔵 AZUL: <span id="score-blue">0</span>/10 💎</div>
        <div class="team-score" style="border-color:#ef4444;">🔴 VERMELHO: <span id="score-red">0</span>/10 💎</div>
        <button class="modal-close" style="position:static;" onclick="exitGame()">SAIR</button>
    </div>

    <div id="countdown-box">VITÓRIA EM <span id="count-sec">15</span>s!</div>

    <!-- CANVAS DO JOGO -->
    <canvas id="game-canvas" width="1000" height="600"></canvas>

    <!-- CONTROLES OVERLAY MOBILE -->
    <div id="touch-overlay">
        <div id="joystick-zone">
            <div id="joystick-base"></div>
            <div id="joystick-stick"></div>
        </div>
        <div class="action-btn" id="btn-shoot">💥</div>
        <div class="action-btn" id="btn-super-touch">⚡</div>
    </div>
</div>

<script>
// --- BANCO DE DADOS DOS BRAWLERS ---
const BRAWLERS = {
    shelly: {
        id: 'shelly', name: 'Shelly', price: 0, currency: 'free',
        hp: 1300, speed: 3.8, type: 'spread', reload: 45, attackDmg: 180, bullets: 5,
        color: '#8e44ad', desc: 'Espingarda em cone. Super destrói paredes!'
    },
    colt: {
        id: 'colt', name: 'Colt', price: 500, currency: 'coins',
        hp: 900, speed: 4.2, type: 'salvo', reload: 38, attackDmg: 130, bullets: 6,
        color: '#e67e22', desc: 'Ráfaga rápida de projéteis em linha reta.'
    },
    primo: {
        id: 'primo', name: 'El Primo', price: 800, currency: 'coins',
        hp: 1800, speed: 4.0, type: 'melee', reload: 32, attackDmg: 260, bullets: 4,
        color: '#27ae60', desc: 'Socos de perto. Super: Salta e esmaga a área!'
    },
    barley: {
        id: 'barley', name: 'Barley', price: 150, currency: 'gems',
        hp: 850, speed: 3.6, type: 'thrower', reload: 50, attackDmg: 200, bullets: 1,
        color: '#d35400', desc: 'Lança garrafas por cima dos muros com poça de ácido.'
    },
    piper: {
        id: 'piper', name: 'Piper', price: 250, currency: 'gems',
        hp: 800, speed: 3.8, type: 'sniper', reload: 65, attackDmg: 550, bullets: 1,
        color: '#3498db', desc: 'Tiro sniper de longo alcance e altíssimo dano.'
    },
    crow: {
        id: 'crow', name: 'Crow', price: 400, currency: 'gems',
        hp: 850, speed: 4.6, type: 'poison', reload: 30, attackDmg: 120, bullets: 3,
        color: '#2c3e50', desc: 'Adagas venenosas em leque e alta velocidade.'
    },
    leon: {
        id: 'leon', name: 'Leon', price: 600, currency: 'gems',
        hp: 1100, speed: 4.4, type: 'stealth', reload: 40, attackDmg: 220, bullets: 4,
        color: '#10b981', desc: 'Shurikens rápidos. Super: Fica INVISÍVEL por 5s!'
    }
};

const SKINS = {
    shelly_star: { id: 'shelly_star', brawler: 'shelly', name: 'Shelly Estelar', price: 50, currency: 'gems', color: '#e74c3c' },
    colt_outlaw: { id: 'colt_outlaw', brawler: 'colt', name: 'Colt Bandido', price: 80, currency: 'gems', color: '#34495e' },
    primo_rudo: { id: 'primo_rudo', brawler: 'primo', name: 'El Rudo Primo', price: 100, currency: 'gems', color: '#9b59b6' },
    crow_white: { id: 'crow_white', brawler: 'crow', name: 'Crow Branco', price: 150, currency: 'gems', color: '#ecf0f1' }
};

// --- MAPA DO PIQUE-GEMA (PAREDES E ARBUSTOS) ---
const MAP_WALLS = [
    // Coberturas centrais e laterais
    {x: 200, y: 150, w: 100, h: 40}, {x: 700, y: 150, w: 100, h: 40},
    {x: 200, y: 410, w: 100, h: 40}, {x: 700, y: 410, w: 100, h: 40},
    {x: 440, y: 180, w: 120, h: 30}, {x: 440, y: 390, w: 120, h: 30},
    {x: 350, y: 270, w: 40, h: 60},  {x: 610, y: 270, w: 40, h: 60}
];

const MAP_BUSHES = [
    {x: 80, y: 80, w: 120, h: 100},  {x: 800, y: 80, w: 120, h: 100},
    {x: 80, y: 420, w: 120, h: 100}, {x: 800, y: 420, w: 120, h: 100},
    {x: 420, y: 80, w: 160, h: 60},  {x: 420, y: 460, w: 160, h: 60}
];

// --- SAVE STATE (LOCALSTORAGE) ---
let userSave = {
    nick: "Jogador",
    trophies: 0, coins: 500, gems: 50,
    unlockedBrawlers: ['shelly'],
    unlockedSkins: [],
    equippedBrawler: 'shelly',
    equippedSkins: {}
};

function loadSave() {
    const data = localStorage.getItem('mini_brawl_v3');
    if (data) userSave = Object.assign(userSave, JSON.parse(data));
    updateMenuUI();
}

function saveGame() {
    localStorage.setItem('mini_brawl_v3', JSON.stringify(userSave));
    updateMenuUI();
}

function updateMenuUI() {
    document.getElementById('menu-trophies').innerText = userSave.trophies;
    document.getElementById('menu-coins').innerText = userSave.coins;
    document.getElementById('menu-gems').innerText = userSave.gems;
    const b = BRAWLERS[userSave.equippedBrawler];
    document.getElementById('equipped-name').innerText = b.name.toUpperCase();
    
    const skinId = userSave.equippedSkins[b.id];
    document.getElementById('equipped-skin-name').innerText = skinId ? SKINS[skinId].name : "Visual Padrão";
    drawPreviewCanvas();
}

// --- INTERFACE DE MODAIS E LOJA ---
let currentShopTab = 'brawlers';

function openModal(id) {
    document.getElementById(id).style.display = 'flex';
    if (id === 'shop-modal') renderShopGrid();
    if (id === 'brawlers-modal') renderBrawlersGrid();
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function switchShopTab(tab) {
    currentShopTab = tab;
    document.getElementById('tab-brawlers-btn').className = `tab-btn ${tab==='brawlers'?'active':''}`;
    document.getElementById('tab-skins-btn').className = `tab-btn ${tab==='skins'?'active':''}`;
    renderShopGrid();
}

function renderShopGrid() {
    const grid = document.getElementById('shop-grid');
    grid.innerHTML = '';

    if (currentShopTab === 'brawlers') {
        for (let key in BRAWLERS) {
            const b = BRAWLERS[key];
            const owned = userSave.unlockedBrawlers.includes(b.id);
            const card = document.createElement('div');
            card.className = 'card-item';
            card.innerHTML = `
                <div style="font-size:32px;">🥊</div>
                <strong style="color:${b.color}">${b.name}</strong>
                <p style="font-size:10px; color:#aaa; margin:4px 0;">${b.desc}</p>
                ${owned ? '<span style="color:#22c55e; font-size:12px;">DESBLOQUEADO</span>' : 
                `<button class="btn-buy" onclick="buyBrawler('${b.id}')">COMPRAR (${b.currency==='coins'?'🪙':'💎'} ${b.price})</button>`}
            `;
            grid.appendChild(card);
        }
    } else {
        for (let key in SKINS) {
            const s = SKINS[key];
            const owned = userSave.unlockedSkins.includes(s.id);
            const card = document.createElement('div');
            card.className = 'card-item';
            card.innerHTML = `
                <div style="font-size:32px;">✨</div>
                <strong style="color:${s.color}">${s.name}</strong>
                <p style="font-size:10px; color:#aaa; margin:4px 0;">Brawler: ${BRAWLERS[s.brawler].name}</p>
                ${owned ? '<span style="color:#22c55e; font-size:12px;">ADQUIRIDA</span>' : 
                `<button class="btn-buy" onclick="buySkin('${s.id}')">COMPRAR (💎 ${s.price})</button>`}
            `;
            grid.appendChild(card);
        }
    }
}

function buyBrawler(id) {
    const b = BRAWLERS[id];
    if (b.currency === 'coins' && userSave.coins >= b.price) {
        userSave.coins -= b.price;
        userSave.unlockedBrawlers.push(id);
        saveGame(); renderShopGrid();
    } else if (b.currency === 'gems' && userSave.gems >= b.price) {
        userSave.gems -= b.price;
        userSave.unlockedBrawlers.push(id);
        saveGame(); renderShopGrid();
    } else { alert("Recursos insuficientes!"); }
}

function buySkin(id) {
    const s = SKINS[id];
    if (userSave.gems >= s.price) {
        userSave.gems -= s.price;
        userSave.unlockedSkins.push(id);
        userSave.equippedSkins[s.brawler] = id;
        saveGame(); renderShopGrid();
    } else { alert("Gemas insuficientes!"); }
}

function renderBrawlersGrid() {
    const grid = document.getElementById('brawlers-grid');
    grid.innerHTML = '';
    userSave.unlockedBrawlers.forEach(bId => {
        const b = BRAWLERS[bId];
        const isEquipped = userSave.equippedBrawler === bId;
        const card = document.createElement('div');
        card.className = `card-item ${isEquipped?'selected':''}`;
        card.innerHTML = `
            <div style="font-size:32px;">🥊</div>
            <strong style="color:${b.color}">${b.name}</strong>
            <button class="btn-buy ${isEquipped?'disabled':''}" onclick="equipBrawler('${bId}')">
                ${isEquipped ? 'EQUIPADO' : 'EQUIPAR'}
            </button>
        `;
        grid.appendChild(card);
    });
}

function equipBrawler(id) {
    userSave.equippedBrawler = id;
    saveGame(); renderBrawlersGrid(); closeModal('brawlers-modal');
}

function drawPreviewCanvas() {
    const cvs = document.getElementById('preview-canvas');
    const ctx = cvs.getContext('2d');
    cvs.width = 170; cvs.height = 170;
    ctx.clearRect(0, 0, 170, 170);

    const b = BRAWLERS[userSave.equippedBrawler];
    const skinId = userSave.equippedSkins[b.id];
    const renderColor = skinId ? SKINS[skinId].color : b.color;

    ctx.save();
    ctx.translate(85, 85);
    ctx.fillStyle = renderColor;
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.restore();
}

// --- CONTROLES DE TOQUE MULTI-TOUCH INTELIGENTES (POINTER EVENTS) ---
let joystickVec = { x: 0, y: 0 };
let activePointerId = null;

function setupTouchEvents() {
    const zone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    let center = { x: 0, y: 0 };

    zone.addEventListener('pointerdown', e => {
        activePointerId = e.pointerId;
        const rect = zone.getBoundingClientRect();
        center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateStick(e);
    });

    window.addEventListener('pointermove', e => {
        if (e.pointerId === activePointerId) updateStick(e);
    });

    const endTouch = e => {
        if (e.pointerId === activePointerId) {
            activePointerId = null;
            stick.style.transform = `translate(0px, 0px)`;
            joystickVec = { x: 0, y: 0 };
        }
    };
    window.addEventListener('pointerup', endTouch);
    window.addEventListener('pointercancel', endTouch);

    function updateStick(e) {
        let dx = e.clientX - center.x;
        let dy = e.clientY - center.y;
        let dist = Math.hypot(dx, dy);
        let maxDist = 40;
        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickVec = { x: dx / maxDist, y: dy / maxDist };
    }

    document.getElementById('btn-shoot').addEventListener('pointerdown', e => {
        e.preventDefault(); fireAttack(false);
    });
    document.getElementById('btn-super-touch').addEventListener('pointerdown', e => {
        e.preventDefault(); fireAttack(true);
    });
}

// --- ENGINE PRINCIPAL DE JOGO ---
let canvas, ctx, gameLoopInterval;
let keys = {};
let mousePos = { x: 0, y: 0 };
let gameState = {
    players: [], bullets: [], gems: [], acidPools: [],
    gemSpawnTimer: 0, countdown: 15, countdownTeam: null
};

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    canvas.style.display = 'block';
    document.getElementById('game-hud').style.display = 'flex';
    document.getElementById('touch-overlay').style.display = 'block';

    gameState.players = [];
    gameState.bullets = [];
    gameState.gems = [];
    gameState.acidPools = [];
    gameState.countdown = 15;
    gameState.countdownTeam = null;

    // Time Azul (Player + 2 Bots)
    const pBrawler = BRAWLERS[userSave.equippedBrawler];
    gameState.players.push(createBrawlerObj(1, userSave.nick, pBrawler, 'blue', 150, 300, false));
    gameState.players.push(createBrawlerObj(2, "Bot Azul 1", BRAWLERS.colt, 'blue', 150, 150, true));
    gameState.players.push(createBrawlerObj(3, "Bot Azul 2", BRAWLERS.primo, 'blue', 150, 450, true));

    // Time Vermelho (3 Bots)
    gameState.players.push(createBrawlerObj(4, "Bot Vermelho 1", BRAWLERS.crow, 'red', 850, 150, true));
    gameState.players.push(createBrawlerObj(5, "Bot Vermelho 2", BRAWLERS.barley, 'red', 850, 300, true));
    gameState.players.push(createBrawlerObj(6, "Bot Vermelho 3", BRAWLERS.leon, 'red', 850, 450, true));

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mousePos.x = e.clientX - rect.left;
        mousePos.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', () => fireAttack(false));

    if (gameLoopInterval) clearInterval(gameLoopInterval);
    gameLoopInterval = setInterval(gameLoop, 1000 / 60);
}

function createBrawlerObj(id, name, brawlerCfg, team, x, y, isBot) {
    return {
        id, name, brawler: brawlerCfg, team, x, y, spawnX: x, spawnY: y,
        hp: brawlerCfg.hp, maxHp: brawlerCfg.hp,
        ammo: 3, reloadTimer: 0, superGauge: 0, angle: 0,
        gems: 0, isBot, isStealth: false, stealthTimer: 0, poisonTicks: 0,
        respawnTimer: 0
    };
}

function checkWallCollision(x, y, radius) {
    return MAP_WALLS.some(w => x + radius > w.x && x - radius < w.x + w.w && y + radius > w.y && y - radius < w.y + w.h);
}

function checkBush(p) {
    return MAP_BUSHES.some(b => p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h);
}

function fireAttack(isSuper) {
    const p = gameState.players[0];
    if (!p || p.hp <= 0) return;

    if (isSuper && p.superGauge < 100) return;
    if (!isSuper && p.ammo < 1) return;

    // Auto-Mira em telas Touch
    let aimAngle = p.angle;
    let closestEnemy = null, minDist = 9999;
    gameState.players.forEach(other => {
        if (other.team !== p.team && other.hp > 0 && !other.isStealth) {
            let dist = Math.hypot(other.x - p.x, other.y - p.y);
            if (dist < minDist) { minDist = dist; closestEnemy = other; }
        }
    });

    if (closestEnemy && Math.abs(joystickVec.x) < 0.1) {
        aimAngle = Math.atan2(closestEnemy.y - p.y, closestEnemy.x - p.x);
    }

    if (isSuper) {
        p.superGauge = 0;
        document.getElementById('btn-super-touch').classList.remove('ready');
        executeSuper(p, aimAngle);
    } else {
        p.ammo--;
        executeNormalAttack(p, aimAngle);
    }
}

function executeNormalAttack(p, angle) {
    const b = p.brawler;
    p.isStealth = false; // Atacar quebra invisibilidade

    if (b.type === 'spread') { // Shelly
        for (let i = -2; i <= 2; i++) {
            gameState.bullets.push({
                x: p.x, y: p.y, vx: Math.cos(angle + i*0.12) * 11, vy: Math.sin(angle + i*0.12) * 11,
                dmg: b.attackDmg, ownerId: p.id, team: p.team, life: 18, type: 'bullet'
            });
        }
    } else if (b.type === 'salvo') { // Colt
        for (let i = 0; i < 4; i++) {
            setTimeout(() => {
                if (p.hp > 0) gameState.bullets.push({
                    x: p.x, y: p.y, vx: Math.cos(angle) * 14, vy: Math.sin(angle) * 14,
                    dmg: b.attackDmg, ownerId: p.id, team: p.team, life: 25, type: 'bullet'
                });
            }, i * 60);
        }
    } else if (b.type === 'thrower') { // Barley
        let targetX = p.x + Math.cos(angle) * 180;
        let targetY = p.y + Math.sin(angle) * 180;
        gameState.bullets.push({
            x: p.x, y: p.y, targetX, targetY, vx: Math.cos(angle)*8, vy: Math.sin(angle)*8,
            dmg: b.attackDmg, ownerId: p.id, team: p.team, life: 22, type: 'lob'
        });
    } else if (b.type === 'poison') { // Crow
        for (let i = -1; i <= 1; i++) {
            gameState.bullets.push({
                x: p.x, y: p.y, vx: Math.cos(angle + i*0.18) * 12, vy: Math.sin(angle + i*0.18) * 12,
                dmg: b.attackDmg, ownerId: p.id, team: p.team, life: 22, type: 'poison'
            });
        }
    } else { // Padrão / Piper / Leon / Primo
        gameState.bullets.push({
            x: p.x, y: p.y, vx: Math.cos(angle) * 13, vy: Math.sin(angle) * 13,
            dmg: b.attackDmg, ownerId: p.id, team: p.team, life: 25, type: 'bullet'
        });
    }
}

function executeSuper(p, angle) {
    const b = p.brawler;
    if (b.id === 'shelly') {
        // Super Blast destrói paredes
        for (let i = -3; i <= 3; i++) {
            gameState.bullets.push({
                x: p.x, y: p.y, vx: Math.cos(angle + i*0.15) * 15, vy: Math.sin(angle + i*0.15) * 15,
                dmg: 350, ownerId: p.id, team: p.team, life: 22, type: 'super_shelly'
            });
        }
    } else if (b.id === 'primo') {
        // Pulo do Primo
        p.x += Math.cos(angle) * 200;
        p.y += Math.sin(angle) * 200;
        // Dano de impacto em área
        gameState.players.forEach(other => {
            if (other.team !== p.team && Math.hypot(other.x - p.x, other.y - p.y) < 90) {
                other.hp -= 500;
            }
        });
    } else if (b.id === 'leon') {
        p.isStealth = true;
        p.stealthTimer = 300; // 5 Segundos
    } else { // Tiros genéricos de Super
        for (let i = -2; i <= 2; i++) {
            gameState.bullets.push({
                x: p.x, y: p.y, vx: Math.cos(angle + i*0.1) * 14, vy: Math.sin(angle + i*0.1) * 14,
                dmg: 300, ownerId: p.id, team: p.team, life: 30, type: 'bullet'
            });
        }
    }
}

function updateGame() {
    const p1 = gameState.players[0];

    // Controles Player 1
    if (p1 && p1.hp > 0) {
        let moveX = 0, moveY = 0;
        if (Math.abs(joystickVec.x) > 0.1 || Math.abs(joystickVec.y) > 0.1) {
            moveX = joystickVec.x * p1.brawler.speed;
            moveY = joystickVec.y * p1.brawler.speed;
            p1.angle = Math.atan2(joystickVec.y, joystickVec.x);
        } else {
            if (keys['w']) moveY -= p1.brawler.speed;
            if (keys['s']) moveY += p1.brawler.speed;
            if (keys['a']) moveX -= p1.brawler.speed;
            if (keys['d']) moveX += p1.brawler.speed;
            p1.angle = Math.atan2(mousePos.y - p1.y, mousePos.x - p1.x);
        }

        if (!checkWallCollision(p1.x + moveX, p1.y, 18)) p1.x += moveX;
        if (!checkWallCollision(p1.x, p1.y + moveY, 18)) p1.y += moveY;
    }

    // Mina de Gemas
    gameState.gemSpawnTimer++;
    if (gameState.gemSpawnTimer >= 300 && gameState.gems.length < 12) { // Cada 5s
        gameState.gemSpawnTimer = 0;
        gameState.gems.push({ x: 500 + (Math.random()*40-20), y: 300 + (Math.random()*40-20) });
    }

    // Atualização de Jogadores e Bots
    let blueGems = 0, redGems = 0;

    gameState.players.forEach(p => {
        if (p.hp <= 0) {
            p.respawnTimer++;
            if (p.respawnTimer >= 240) { // Respawn após 4 segundos
                p.hp = p.maxHp; p.x = p.spawnX; p.y = p.spawnY;
                p.gems = 0; p.respawnTimer = 0;
            }
            return;
        }

        if (p.team === 'blue') blueGems += p.gems; else redGems += p.gems;

        // Stealth
        if (p.isStealth) {
            p.stealthTimer--;
            if (p.stealthTimer <= 0) p.isStealth = false;
        }

        // Poison
        if (p.poisonTicks > 0 && Math.random() < 0.05) {
            p.hp -= 20; p.poisonTicks--;
        }

        // Recarga
        if (p.ammo < 3) {
            p.reloadTimer++;
            if (p.reloadTimer >= p.brawler.reload) { p.ammo++; p.reloadTimer = 0; }
        }

        // Coleta de Gemas
        for (let i = gameState.gems.length - 1; i >= 0; i--) {
            let g = gameState.gems[i];
            if (Math.hypot(p.x - g.x, p.y - g.y) < 25) {
                p.gems++;
                gameState.gems.splice(i, 1);
            }
        }

        // IA Inteligente dos Bots
        if (p.isBot) {
            let targetX = 500, targetY = 300; // Foco na Mina
            // Procura gemas no chão
            if (gameState.gems.length > 0) {
                targetX = gameState.gems[0].x; targetY = gameState.gems[0].y;
            }
            let angle = Math.atan2(targetY - p.y, targetX - p.x);
            p.angle = angle;
            let vx = Math.cos(angle) * (p.brawler.speed * 0.6);
            let vy = Math.sin(angle) * (p.brawler.speed * 0.6);
            if (!checkWallCollision(p.x + vx, p.y + vy, 18)) {
                p.x += vx; p.y += vy;
            }

            // Ataca inimigos próximos
            gameState.players.forEach(other => {
                if (other.team !== p.team && other.hp > 0 && !other.isStealth) {
                    if (Math.hypot(other.x - p.x, other.y - p.y) < 180 && p.ammo >= 1 && Math.random() < 0.03) {
                        p.ammo--;
                        executeNormalAttack(p, Math.atan2(other.y - p.y, other.x - p.x));
                    }
                }
            });
        }
    });

    document.getElementById('score-blue').innerText = blueGems;
    document.getElementById('score-red').innerText = redGems;

    // Regra de Vitória (10 Gemas)
    if (blueGems >= 10 || redGems >= 10) {
        let winningTeam = blueGems >= 10 ? 'blue' : 'red';
        document.getElementById('countdown-box').style.display = 'block';
        if (gameState.countdownTeam !== winningTeam) {
            gameState.countdownTeam = winningTeam;
            gameState.countdown = 15;
        }
        if (Math.random() < 0.02) gameState.countdown--;
        document.getElementById('count-sec').innerText = gameState.countdown;

        if (gameState.countdown <= 0) {
            finishMatch(gameState.countdownTeam === 'blue');
        }
    } else {
        document.getElementById('countdown-box').style.display = 'none';
        gameState.countdownTeam = null;
    }

    // Atualiza Balas
    for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        let b = gameState.bullets[i];
        b.x += b.vx; b.y += b.vy; b.life--;

        // Destrói muro com Super
        if (b.type === 'super_shelly') {
            MAP_WALLS.forEach((w, wIdx) => {
                if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
                    MAP_WALLS.splice(wIdx, 1);
                }
            });
        } else if (checkWallCollision(b.x, b.y, 4) && b.type !== 'lob') {
            b.life = 0;
        }

        // Colisão com Jogadores
        gameState.players.forEach(p => {
            if (p.team !== b.team && p.hp > 0) {
                if (Math.hypot(p.x - b.x, p.y - b.y) < 22) {
                    p.hp -= b.dmg;
                    b.life = 0;

                    if (b.type === 'poison') p.poisonTicks = 5;

                    // Se morreu, derruba todas as gemas
                    if (p.hp <= 0 && p.gems > 0) {
                        for (let g = 0; g < p.gems; g++) {
                            gameState.gems.push({ x: p.x + (Math.random()*30-15), y: p.y + (Math.random()*30-15) });
                        }
                        p.gems = 0;
                    }

                    // Carrega Super
                    if (b.ownerId === 1 && p1) {
                        p1.superGauge = Math.min(100, p1.superGauge + 20);
                        if (p1.superGauge >= 100) document.getElementById('btn-super-touch').classList.add('ready');
                    }
                }
            }
        });

        if (b.life <= 0) gameState.bullets.splice(i, 1);
    }
}

function finishMatch(isVictory) {
    clearInterval(gameLoopInterval);
    gameLoopInterval = null;

    let trophiesDelta = isVictory ? 8 : -4;
    let coinsDelta = isVictory ? 30 : 10;
    let gemsDelta = isVictory ? 5 : 0;

    userSave.trophies = Math.max(0, userSave.trophies + trophiesDelta);
    userSave.coins += coinsDelta;
    userSave.gems += gemsDelta;
    saveGame();

    document.getElementById('end-title').innerText = isVictory ? "VITÓRIA!" : "DERROTA!";
    document.getElementById('end-title').style.color = isVictory ? "#22c55e" : "#ef4444";
    document.getElementById('end-icon').innerText = isVictory ? "🏆" : "💀";
    document.getElementById('reward-trophies').innerText = (trophiesDelta >= 0 ? "+" : "") + trophiesDelta;
    document.getElementById('reward-coins').innerText = "+" + coinsDelta;
    document.getElementById('reward-gems').innerText = "+" + gemsDelta;

    openModal('game-over-modal');
}

function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenha Chão do Arena
    ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, 1000, 600);

    // Desenha Arbustos
    ctx.fillStyle = 'rgba(34, 197, 94, 0.7)';
    MAP_BUSHES.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // Desenha Paredes
    ctx.fillStyle = '#78350f'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    MAP_WALLS.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Mina de Gemas Central
    ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(500, 300, 25, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(500, 300, 12, 0, Math.PI*2); ctx.fill();

    // Desenha Gemas no chão
    gameState.gems.forEach(g => {
        ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(g.x, g.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    });

    // Desenha Projéteis
    gameState.bullets.forEach(b => {
        ctx.fillStyle = b.type === 'poison' ? '#22c55e' : '#f59e0b';
        ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
    });

    // Desenha Jogadores
    gameState.players.forEach(p => {
        if (p.hp <= 0) return;

        // Se estiver no mato e for inimigo, não desenha!
        let inBush = checkBush(p);
        if (inBush && p.team !== 'blue' && !p.isBot) return;

        ctx.save();
        ctx.globalAlpha = p.isStealth ? 0.3 : (inBush ? 0.6 : 1.0);

        // Anel de Time no Chão
        ctx.strokeStyle = p.team === 'blue' ? '#3b82f6' : '#ef4444';
        ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI*2); ctx.stroke();

        // Corpo
        const skinId = userSave.equippedSkins[p.brawler.id];
        ctx.fillStyle = (p.id === 1 && skinId) ? SKINS[skinId].color : p.brawler.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();

        // Nome e Gemas
        ctx.fillStyle = '#fff'; ctx.font = '12px Lilita One'; ctx.textAlign = 'center';
        ctx.fillText(`${p.name} 💎${p.gems}`, p.x, p.y - 28);

        // Barra de Vida
        ctx.fillStyle = '#b91c1c'; ctx.fillRect(p.x - 20, p.y - 22, 40, 5);
        ctx.fillStyle = '#22c55e'; ctx.fillRect(p.x - 20, p.y - 22, Math.max(0, (p.hp / p.maxHp) * 40), 5);

        ctx.restore();
    });
}

function gameLoop() {
    updateGame();
    drawGame();
}

function exitGame() {
    if (gameLoopInterval) clearInterval(gameLoopInterval);
    canvas.style.display = 'none';
    document.getElementById('game-hud').style.display = 'none';
    document.getElementById('touch-overlay').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

window.onload = () => {
    loadSave();
    setupTouchEvents();
};
</script>
