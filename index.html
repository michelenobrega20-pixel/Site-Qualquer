<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Brawl Stars - Mobile & Desktop</title>
    <!-- Fonte Estilo Brawl Stars -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Lilita One', cursive, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: #0b1d3a;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            max-width: 100vw;
            max-height: 100vh;
            background: radial-gradient(circle, #1a4d8c 0%, #0a1b36 100%);
            border: 4px solid #000;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- MENU PRINCIPAL --- */
        #main-menu {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, #186cb8 0%, #0a2d58 100%);
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #000;
        }

        .profile-card {
            display: flex;
            align-items: center;
            background: #122138;
            border: 3px solid #000;
            border-radius: 12px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .profile-avatar {
            width: 42px;
            height: 42px;
            background: #ffcc00;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-right: 8px;
        }

        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 16px; color: #fff; text-shadow: 2px 2px #000; }
        .profile-tag { font-size: 11px; color: #aaa; }

        .trophy-badge {
            background: #e67e22;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 2px 8px;
            margin-left: 10px;
            font-size: 14px;
            text-shadow: 1px 1px #000;
        }

        .resources { display: flex; gap: 10px; }
        .res-box {
            background: #0d192b;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            text-shadow: 1px 1px #000;
        }

        .side-menu {
            position: absolute;
            top: 75px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }

        .side-left { left: 15px; }
        .side-right { right: 15px; }

        .btn-side {
            width: 75px;
            height: 60px;
            background: linear-gradient(180deg, #2980b9 0%, #1c5982 100%);
            border: 3px solid #000;
            border-radius: 12px;
            box-shadow: 0 4px 0 #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .center-brawler-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        #brawler-preview-canvas { width: 160px; height: 160px; }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 3px solid #000;
        }

        .mode-selector {
            width: 260px;
            height: 60px;
            background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%);
            border: 3px solid #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            cursor: pointer;
            gap: 10px;
        }

        .btn-play {
            width: 180px;
            height: 65px;
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
            border: 4px solid #000;
            border-radius: 16px;
            box-shadow: 0 6px 0 #000;
            font-size: 26px;
            color: #fff;
            text-shadow: 2px 2px #000;
            cursor: pointer;
        }

        /* --- MODAIS --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            width: 90%;
            max-width: 650px;
            background: #1a2a40;
            border: 4px solid #000;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px; right: 15px;
            background: #e74c3c;
            border: 2px solid #000;
            border-radius: 8px;
            color: white;
            padding: 4px 12px;
            cursor: pointer;
        }

        .brawlers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .brawler-card {
            background: #2c3e50;
            border: 3px solid #000;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .brawler-card.selected { border-color: #f1c40f; box-shadow: 0 0 10px #f1c40f; }

        /* Raridades */
        .rarity-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid #000; text-transform: uppercase; margin-top: 4px; }
        .rare { background-color: #2ecc71; color: #000; }
        .super-rare { background-color: #3498db; color: #fff; }
        .epic { background-color: #9b59b6; color: #fff; }
        .mythic { background-color: #e74c3c; color: #fff; }
        .legendary { background-color: #f1c40f; color: #000; }
        .ultra-legendary { background: linear-gradient(45deg, #ff007f, #00f0ff); color: #fff; }

        /* --- CANVAS E CONTROLES DE JOGO --- */
        #game-canvas { display: none; width: 100%; height: 100%; background-color: #27ae60; }

        .hud-overlay {
            position: absolute;
            top: 10px; left: 10px;
            display: none;
            gap: 10px;
            z-index: 15;
        }

        .hud-card {
            background: rgba(0,0,0,0.6);
            border: 2px solid #000;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 14px;
        }

        /* CONTROLES TOUCH (MOBILE) */
        #touch-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
            z-index: 20;
        }

        #joystick-area {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 150px; height: 150px;
            pointer-events: auto;
        }

        #joystick-base {
            width: 130px; height: 130px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 10px; left: 10px;
        }

        #joystick-knob {
            width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 47px; left: 47px;
        }

        .touch-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 50%;
            border: 4px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 0 #000;
        }

        .touch-btn:active { transform: scale(0.92); }

        #btn-attack {
            bottom: 30px; right: 30px;
            width: 80px; height: 80px;
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
        }

        #btn-super {
            bottom: 120px; right: 45px;
            width: 65px; height: 65px;
            background: linear-gradient(180deg, #f1c40f 0%, #f39c12 100%);
            opacity: 0.4;
        }

        #btn-super.ready {
            opacity: 1.0;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .btn-action {
            background: #27ae60;
            border: 2px solid #000;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- MENU PRINCIPAL -->
    <div id="main-menu">
        <div class="top-bar">
            <div class="profile-card">
                <div class="profile-avatar">🤠</div>
                <div class="profile-info">
                    <span class="profile-name" id="menu-name">Jogador</span>
                    <span class="profile-tag">#PLAYER123</span>
                </div>
                <div class="trophy-badge">🏆 <span id="menu-trophies">0</span></div>
            </div>

            <div class="resources">
                <div class="res-box">🪙 <span id="menu-coins">100</span></div>
                <div class="res-box">💎 <span id="menu-gems">10</span></div>
            </div>
        </div>

        <!-- Botões Esquerda -->
        <div class="side-menu side-left">
            <div class="btn-side" onclick="openModal('brawlers-modal')">🥊<span>BRAWLERS</span></div>
        </div>

        <!-- Exibição Central -->
        <div class="center-brawler-display">
            <canvas id="brawler-preview-canvas"></canvas>
            <h2 id="equipped-brawler-name" style="text-shadow: 2px 2px #000;">SHELLY</h2>
        </div>

        <!-- Barra Inferior -->
        <div class="bottom-bar">
            <div class="mode-selector">
                <span style="font-size: 30px;">💎</span>
                <div>
                    <div style="font-size: 16px;">PIQUE-GEMA</div>
                    <div style="font-size: 11px; color: #ccc;">Sobreviva e Vença</div>
                </div>
            </div>

            <button class="btn-play" onclick="startGame()">JOGAR</button>
        </div>
    </div>

    <!-- MODAL BRAWLERS -->
    <div class="modal-overlay" id="brawlers-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('brawlers-modal')">X</button>
            <h2>SELECIONE SEU BRAWLER</h2>
            <div class="brawlers-grid" id="brawlers-list"></div>
        </div>
    </div>

    <!-- MODAL FIM DE JOGO (TROFÉUS E GEMAS) -->
    <div class="modal-overlay" id="game-over-modal">
        <div class="modal-box" style="text-align: center; align-items: center;">
            <h1 id="end-title" style="font-size: 36px; margin-bottom: 10px;">VITÓRIA!</h1>
            <div style="font-size: 50px; margin: 10px 0;" id="end-icon">🏆</div>
            <div style="display: flex; gap: 20px; font-size: 22px; margin-bottom: 20px;">
                <div>🏆 <span id="reward-trophies">+8</span></div>
                <div>💎 <span id="reward-gems">+5</span></div>
                <div>🪙 <span id="reward-coins">+25</span></div>
            </div>
            <button class="btn-action" style="width: 80%;" onclick="closeModal('game-over-modal'); exitGame();">CONTINUAR</button>
        </div>
    </div>

    <!-- CANVAS DE JOGO -->
    <canvas id="game-canvas" width="1000" height="600"></canvas>
    
    <!-- HUD DE BRAWL -->
    <div class="hud-overlay" id="game-hud">
        <div class="hud-card">👥 Vivos: <span id="hud-alive">6</span></div>
        <button class="modal-close" style="position: static;" onclick="exitGame()">SAIR</button>
    </div>

    <!-- CONTROLES MOBILE (TOUCH) -->
    <div id="touch-controls">
        <div id="joystick-area">
            <div id="joystick-base"></div>
            <div id="joystick-knob"></div>
        </div>
        <div class="touch-btn" id="btn-attack">💥</div>
        <div class="touch-btn" id="btn-super">⚡</div>
    </div>
</div>

<script>
// --- BANCO DE DADOS DOS BRAWLERS ---
const BRAWLERS = {
    shelly: {
        id: 'shelly', name: 'Shelly', rarity: 'rare', color: '#8e44ad',
        hp: 1200, speed: 3.8, aimType: 'cone', range: 180, reloadSpeed: 50,
        attackDmg: 180, superDmg: 450
    },
    colt: {
        id: 'colt', name: 'Colt', rarity: 'super-rare', color: '#e67e22',
        hp: 850, speed: 4.2, aimType: 'line', range: 280, reloadSpeed: 40,
        attackDmg: 140, superDmg: 350
    },
    spike: {
        id: 'spike', name: 'Spike', rarity: 'legendary', color: '#2ecc71',
        hp: 750, speed: 3.6, aimType: 'line', range: 220, reloadSpeed: 50,
        attackDmg: 250, superDmg: 500
    },
    chronos: {
        id: 'chronos', name: 'Chronos', rarity: 'ultra-legendary', color: '#00f0ff',
        hp: 1400, speed: 4.5, aimType: 'line', range: 320, reloadSpeed: 30,
        attackDmg: 350, superDmg: 700
    }
};

// --- ESTADO DO JOGO COM SALVAMENTO (LOCALSTORAGE) ---
let playerState = {
    nick: "Jogador",
    trophies: 0,
    coins: 100,
    gems: 10,
    equippedBrawler: "shelly"
};

function loadSaveData() {
    const saved = localStorage.getItem('mini_brawl_save');
    if (saved) playerState = Object.assign(playerState, JSON.parse(saved));
    updateMenuUI();
}

function saveData() {
    localStorage.setItem('mini_brawl_save', JSON.stringify(playerState));
    updateMenuUI();
}

function updateMenuUI() {
    document.getElementById('menu-trophies').innerText = playerState.trophies;
    document.getElementById('menu-coins').innerText = playerState.coins;
    document.getElementById('menu-gems').innerText = playerState.gems;
}

let activeBrawler = BRAWLERS.shelly;
let gameInterval = null;

function initUI() {
    loadSaveData();
    renderBrawlersGrid();
    drawPreviewCanvas();
    setupTouchControls();
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function renderBrawlersGrid() {
    const grid = document.getElementById('brawlers-list');
    grid.innerHTML = '';
    for (let key in BRAWLERS) {
        const b = BRAWLERS[key];
        const card = document.createElement('div');
        card.className = `brawler-card ${playerState.equippedBrawler === b.id ? 'selected' : ''}`;
        card.innerHTML = `
            <div style="font-size:30px;">🥊</div>
            <div style="font-size:14px; margin-top:4px;">${b.name}</div>
            <span class="rarity-tag ${b.rarity}">${b.rarity}</span>
        `;
        card.onclick = () => {
            playerState.equippedBrawler = b.id;
            activeBrawler = BRAWLERS[b.id];
            document.getElementById('equipped-brawler-name').innerText = b.name.toUpperCase();
            saveData();
            renderBrawlersGrid();
            drawPreviewCanvas();
            closeModal('brawlers-modal');
        };
        grid.appendChild(card);
    }
}

function drawPreviewCanvas() {
    const cvs = document.getElementById('brawler-preview-canvas');
    const ctx = cvs.getContext('2d');
    cvs.width = 160; cvs.height = 160;
    ctx.clearRect(0, 0, 160, 160);

    ctx.save();
    ctx.translate(80, 80);
    ctx.fillStyle = activeBrawler.color;
    ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.restore();
}

// --- CONTROLES TOUCH E JOYSTICK VIRTUAL ---
let joystickVec = { x: 0, y: 0 };
let isTouchDevice = false;

function setupTouchControls() {
    const area = document.getElementById('joystick-area');
    const knob = document.getElementById('joystick-knob');
    let touchId = null;
    let basePos = { x: 0, y: 0 };

    area.addEventListener('touchstart', (e) => {
        isTouchDevice = true;
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        const rect = area.getBoundingClientRect();
        basePos = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    });

    area.addEventListener('touchmove', (e) => {
        if (touchId === null) return;
        for (let touch of e.changedTouches) {
            if (touch.identifier === touchId) {
                let dx = touch.clientX - basePos.x;
                let dy = touch.clientY - basePos.y;
                let dist = Math.hypot(dx, dy);
                let maxDist = 45;

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVec.x = dx / maxDist;
                joystickVec.y = dy / maxDist;
            }
        }
    });

    const resetJoystick = (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === touchId) {
                touchId = null;
                knob.style.transform = `translate(0px, 0px)`;
                joystickVec = { x: 0, y: 0 };
            }
        }
    };

    area.addEventListener('touchend', resetJoystick);
    area.addEventListener('touchcancel', resetJoystick);

    // Botões de Ataque e Super
    document.getElementById('btn-attack').addEventListener('touchstart', (e) => {
        e.preventDefault();
        triggerAttack(false);
    });

    document.getElementById('btn-super').addEventListener('touchstart', (e) => {
        e.preventDefault();
        triggerAttack(true);
    });
}

// --- ENGINE DO JOGO ---
let canvas, ctx;
let keys = {};
let mousePos = { x: 0, y: 0 };
let gameState = { players: [], bullets: [] };

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    canvas.style.display = 'block';
    document.getElementById('game-hud').style.display = 'flex';
    document.getElementById('touch-controls').style.display = 'block';

    // Cria jogador Principal
    gameState.players = [createPlayer(1, playerState.nick, activeBrawler, 200, 300, false)];

    // Cria 5 Bots Inimigos
    for (let i = 2; i <= 6; i++) {
        const bKeys = Object.keys(BRAWLERS);
        const randomBrawler = BRAWLERS[bKeys[Math.floor(Math.random() * bKeys.length)]];
        gameState.players.push(createPlayer(i, `Inimigo ${i-1}`, randomBrawler, Math.random()*700+150, Math.random()*400+100, true));
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mousePos.x = e.clientX - rect.left;
        mousePos.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', () => triggerAttack(false));

    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, 1000 / 60);
}

function createPlayer(id, name, brawlerConfig, x, y, isBot) {
    return {
        id, name, brawler: brawlerConfig,
        x, y, hp: brawlerConfig.hp, maxHp: brawlerConfig.hp,
        ammo: 3, reloadTimer: 0, superGauge: 0, angle: 0, isBot
    };
}

function getClosestEnemy(p) {
    let closest = null;
    let minDist = 9999;
    gameState.players.forEach(other => {
        if (other.id !== p.id && other.hp > 0) {
            let dist = Math.hypot(other.x - p.x, other.y - p.y);
            if (dist < minDist) {
                minDist = dist;
                closest = other;
            }
        }
    });
    return closest;
}

function triggerAttack(isSuper) {
    const p = gameState.players[0];
    if (!p || p.hp <= 0) return;

    if (isSuper && p.superGauge < 100) return;
    if (!isSuper && p.ammo < 1) return;

    // Auto-Mira para telas Touch ou Mouse
    let targetAngle = p.angle;
    if (isTouchDevice) {
        const closest = getClosestEnemy(p);
        if (closest) targetAngle = Math.atan2(closest.y - p.y, closest.x - p.x);
    }

    if (isSuper) {
        p.superGauge = 0;
        document.getElementById('btn-super').classList.remove('ready');
        // Super Disparo Triplo Forte
        for (let i = -1; i <= 1; i++) {
            gameState.bullets.push({
                x: p.x, y: p.y,
                vx: Math.cos(targetAngle + i*0.2) * 14,
                vy: Math.sin(targetAngle + i*0.2) * 14,
                dmg: p.brawler.superDmg, ownerId: p.id, life: 30, isSuper: true
            });
        }
    } else {
        p.ammo--;
        gameState.bullets.push({
            x: p.x, y: p.y,
            vx: Math.cos(targetAngle) * 11,
            vy: Math.sin(targetAngle) * 11,
            dmg: p.brawler.attackDmg, ownerId: p.id, life: 25, isSuper: false
        });
    }
}

function updateGame() {
    const p1 = gameState.players[0];

    if (p1 && p1.hp > 0) {
        // Movimento (Joystick ou WASD)
        if (Math.abs(joystickVec.x) > 0.1 || Math.abs(joystickVec.y) > 0.1) {
            p1.x += joystickVec.x * p1.brawler.speed;
            p1.y += joystickVec.y * p1.brawler.speed;
            p1.angle = Math.atan2(joystickVec.y, joystickVec.x);
        } else {
            if (keys['w']) p1.y -= p1.brawler.speed;
            if (keys['s']) p1.y += p1.brawler.speed;
            if (keys['a']) p1.x -= p1.brawler.speed;
            if (keys['d']) p1.x += p1.brawler.speed;
            if (!isTouchDevice) p1.angle = Math.atan2(mousePos.y - p1.y, mousePos.x - p1.x);
        }
    }

    // Atualização de Jogadores e Bots
    let aliveCount = 0;
    gameState.players.forEach(p => {
        if (p.hp <= 0) return;
        aliveCount++;

        // Recarga Munição
        if (p.ammo < 3) {
            p.reloadTimer++;
            if (p.reloadTimer >= p.brawler.reloadSpeed) {
                p.ammo++;
                p.reloadTimer = 0;
            }
        }

        // IA dos Bots
        if (p.isBot) {
            const closest = getClosestEnemy(p);
            if (closest) {
                p.angle = Math.atan2(closest.y - p.y, closest.x - p.x);
                if (Math.hypot(closest.x - p.x, closest.y - p.y) > 120) {
                    p.x += Math.cos(p.angle) * (p.brawler.speed * 0.5);
                    p.y += Math.sin(p.angle) * (p.brawler.speed * 0.5);
                } else if (Math.random() < 0.02 && p.ammo >= 1) {
                    p.ammo--;
                    gameState.bullets.push({
                        x: p.x, y: p.y,
                        vx: Math.cos(p.angle) * 10, vy: Math.sin(p.angle) * 10,
                        dmg: p.brawler.attackDmg, ownerId: p.id, life: 25
                    });
                }
            }
        }
    });

    document.getElementById('hud-alive').innerText = aliveCount;

    // Atualiza Balas
    for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        let b = gameState.bullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;

        gameState.players.forEach(p => {
            if (p.id !== b.ownerId && p.hp > 0) {
                if (Math.hypot(p.x - b.x, p.y - b.y) < 22) {
                    p.hp -= b.dmg;
                    b.life = 0;

                    // Carrega o Super do Atacante
                    if (b.ownerId === 1 && p1) {
                        p1.superGauge = Math.min(100, p1.superGauge + 25);
                        if (p1.superGauge >= 100) {
                            document.getElementById('btn-super').classList.add('ready');
                        }
                    }
                }
            }
        });

        if (b.life <= 0) gameState.bullets.splice(i, 1);
    }

    // Verificação de Fim de Jogo
    if (p1.hp <= 0 && gameInterval) {
        finishGame(false);
    } else if (aliveCount === 1 && p1.hp > 0 && gameInterval) {
        finishGame(true);
    }
}

function finishGame(isVictory) {
    clearInterval(gameInterval);
    gameInterval = null;

    let trophiesChange = isVictory ? 8 : -4;
    let gemsChange = isVictory ? 5 : 0;
    let coinsChange = isVictory ? 25 : 5;

    playerState.trophies = Math.max(0, playerState.trophies + trophiesChange);
    playerState.gems += gemsChange;
    playerState.coins += coinsChange;
    saveData();

    document.getElementById('end-title').innerText = isVictory ? "VITÓRIA!" : "DERROTA!";
    document.getElementById('end-title').style.color = isVictory ? "#2ecc71" : "#e74c3c";
    document.getElementById('end-icon').innerText = isVictory ? "🏆" : "💀";
    document.getElementById('reward-trophies').innerText = (trophiesChange >= 0 ? "+" : "") + trophiesChange;
    document.getElementById('reward-gems').innerText = "+" + gemsChange;
    document.getElementById('reward-coins').innerText = "+" + coinsChange;

    openModal('game-over-modal');
}

function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenha Balas
    gameState.bullets.forEach(b => {
        ctx.fillStyle = b.isSuper ? '#f1c40f' : '#e74c3c';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.isSuper ? 8 : 5, 0, Math.PI * 2); ctx.fill();
    });

    // Desenha Jogadores
    gameState.players.forEach(p => {
        if (p.hp <= 0) return;

        // Corpo
        ctx.fillStyle = p.brawler.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();

        // Nome
        ctx.fillStyle = '#fff'; ctx.font = '12px Lilita One'; ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 28);

        // Barra de HP
        ctx.fillStyle = '#c0392b'; ctx.fillRect(p.x - 20, p.y - 22, 40, 5);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(p.x - 20, p.y - 22, Math.max(0, (p.hp / p.maxHp) * 40), 5);
    });
}

function gameLoop() {
    updateGame();
    drawGame();
}

function exitGame() {
    if (gameInterval) clearInterval(gameInterval);
    canvas.style.display = 'none';
    document.getElementById('game-hud').style.display = 'none';
    document.getElementById('touch-controls').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

window.onload = initUI;
</script>
